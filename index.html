<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่การ์ดสัตว์แสนสนุก | Animal Memory Match</title>
    <!-- Google Fonts - Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="glass-bg-2"></div>
    
    <div class="app-container">
        <header class="game-header">
            <div class="brand">
                <h1>🐾 Animal Match</h1>
                <p class="subtitle">จับคู่เพื่อนสัตว์แสนน่ารัก</p>
            </div>
            
            <div class="stats-panel">
                <div class="stat-card">
                    <span class="stat-label">เวลา</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">ครั้งที่เปิด</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat-card best-score">
                    <span class="stat-label">สถิติดีที่สุด</span>
                    <span class="stat-value" id="best-score">--</span>
                </div>
            </div>
            
            <div class="controls-panel">
                <button id="sound-toggle" class="btn-icon" aria-label="เปิด/ปิดเสียง">
                    <span class="icon">🔊</span>
                    <span class="text">เสียง: เปิด</span>
                </button>
                <button id="restart-btn" class="btn-primary">
                    <span class="icon">🔄</span> เริ่มเกมใหม่
                </button>
            </div>
        </header>

        <main class="game-board-wrapper">
            <div class="card-grid" id="card-grid">
                <!-- Cards will be dynamically generated by JS -->
            </div>
        </main>
    </div>

    <!-- Win Modal Overlay -->
    <div class="modal-overlay" id="win-modal-overlay">
        <div class="win-modal" id="win-modal">
            <div class="win-icon">🎉</div>
            <h2>สุดยอดไปเลย!</h2>
            <p class="win-msg">คุณจับคู่เพื่อนสัตว์ได้ครบทั้งหมดแล้ว!</p>
            
            <div class="win-stats">
                <div class="win-stat-item">
                    <span class="label">เวลาที่ใช้</span>
                    <span class="value" id="final-time">00:00</span>
                </div>
                <div class="win-stat-item">
                    <span class="label">เปิดทั้งหมด</span>
                    <span class="value" id="final-moves">0 ครั้ง</span>
                </div>
            </div>

            <div class="new-record-banner" id="new-record-banner">
                🏆 สถิติใหม่!
            </div>
            
            <button id="play-again-btn" class="btn-primary btn-large">
                เล่นอีกครั้ง 🎮
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
